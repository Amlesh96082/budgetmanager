<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Transaction | BudgetManager</title>

    <link rel="stylesheet"
          th:href="@{/css/transaction.css}">

</head>

<body>

<div class="page-container">

    <div class="transaction-card">

        <div class="card-header">

            <a th:href="@{/dashboard}"
               class="back-btn">
                ←
            </a>

            <div>
                <h1 th:text="${transaction.type == 'INCOME'
                        ? 'Add Income'
                        : 'Add Expense'}">
                    Add Transaction
                </h1>

                <p>
                    Enter your transaction details
                </p>
            </div>

        </div>


        <form th:action="@{/transactions/add}"
              th:object="${transaction}"
              method="post">


            <!-- TYPE -->

            <input type="hidden"
                   th:field="*{type}">


            <!-- TITLE -->

            <div class="form-group">

                <label>Title</label>

                <input type="text"
                       th:field="*{title}"
                       placeholder="e.g. Monthly Salary"
                       required>

            </div>


            <!-- AMOUNT -->

            <div class="form-group">

                <label>Amount</label>

                <div class="amount-input">

                    <span>₹</span>

                    <input type="number"
                           th:field="*{amount}"
                           placeholder="0.00"
                           min="0.01"
                           step="0.01"
                           required>

                </div>

            </div>


            <!-- CATEGORY -->

            <div class="form-group">

                <label>Category</label>

                <select th:field="*{category}" required>

                    <option value="">
                        Select category
                    </option>

                    <!-- INCOME CATEGORIES -->

                    <th:block th:if="${transaction.type == 'INCOME'}">

                        <option value="Salary">
                            Salary
                        </option>

                        <option value="Freelance">
                            Freelance
                        </option>

                        <option value="Business">
                            Business
                        </option>

                        <option value="Investment">
                            Investment
                        </option>

                        <option value="Other Income">
                            Other Income
                        </option>

                    </th:block>


                    <!-- EXPENSE CATEGORIES -->

                    <th:block th:if="${transaction.type == 'EXPENSE'}">

                        <option value="Food">
                            Food & Dining
                        </option>

                        <option value="Shopping">
                            Shopping
                        </option>

                        <option value="Transportation">
                            Transportation
                        </option>

                        <option value="Bills">
                            Bills & Utilities
                        </option>

                        <option value="Entertainment">
                            Entertainment
                        </option>

                        <option value="Health">
                            Health
                        </option>

                        <option value="Education">
                            Education
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </th:block>

                </select>

            </div>


            <!-- DATE -->

            <div class="form-group">

                <label>Transaction Date</label>

                <input type="date"
                       th:field="*{transactionDate}"
                       required>

            </div>


            <!-- DESCRIPTION -->

            <div class="form-group">

                <label>
                    Description
                    <span>(Optional)</span>
                </label>

                <textarea th:field="*{description}"
                          rows="4"
                          maxlength="500"
                          placeholder="Add a note about this transaction...">
                </textarea>

            </div>


            <!-- BUTTONS -->

            <div class="form-actions">

                <a th:href="@{/dashboard}"
                   class="cancel-btn">
                    Cancel
                </a>

                <button type="submit"
                        th:class="${transaction.type == 'INCOME'}
                        ? 'save-btn income-save'
                        : 'save-btn expense-save'">

                    <span th:text="${transaction.type == 'INCOME'}
                            ? 'Add Income'
                            : 'Add Expense'">
                    </span>

                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>
