<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Password | BudgetManager</title>

    <link rel="stylesheet" th:href="@{/css/settings.css}">
</head>

<body>

<div class="app-container">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">
            <div class="logo-icon">▣</div>
            <h2>Budget<span>Manager</span></h2>
        </div>

        <nav>

            <a th:href="@{/dashboard}" class="nav-link">
                <span>▦</span>
                Dashboard
            </a>

            <a th:href="@{/transactions}" class="nav-link">
                <span>⇄</span>
                Transactions
            </a>

            <a th:href="@{/budgets}" class="nav-link">
                <span>₹</span>
                Budget
            </a>

            <a th:href="@{/goals}" class="nav-link">
                <span>◉</span>
                Goals
            </a>

            <a th:href="@{/reports}" class="nav-link">
                <span>▥</span>
                Reports
            </a>

        </nav>

        <div class="sidebar-bottom">

            <a th:href="@{/settings}"
               class="nav-link active">
                <span>⚙</span>
                Settings
            </a>

            <form th:action="@{/logout}"
                  method="post"
                  class="logout-form">

                <button type="submit"
                        class="nav-link logout logout-button">

                    <span>↪</span>
                    Logout

                </button>

            </form>

        </div>

    </aside>


    <!-- MAIN -->

    <main class="main-content">

        <div class="page-header">

            <p class="page-label">Security</p>

            <h1>Change Password</h1>

            <p>
                Update your account password securely.
            </p>

        </div>


        <section class="settings-card password-card">

            <div class="card-header">

                <h2>Update Password</h2>

                <p>
                    Enter your current password and choose a new password.
                </p>

            </div>
            <div class="alert error-alert"
                 th:if="${error}"
                 th:text="${error}">
            </div>

            <div class="alert success-alert"
                 th:if="${success}"
                 th:text="${success}">
            </div>

            <form th:action="@{/settings/change-password}"
                  method="post"
                  class="password-form">


                <div class="form-group">

                    <label for="currentPassword">
                        Current Password
                    </label>

                    <input
                            type="password"
                            id="currentPassword"
                            name="currentPassword"
                            placeholder="Enter current password"
                            required>

                </div>


                <div class="form-group">

                    <label for="newPassword">
                        New Password
                    </label>

                    <input
                            type="password"
                            id="newPassword"
                            name="newPassword"
                            placeholder="Enter new password"
                            required>

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm New Password
                    </label>

                    <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm new password"
                            required>

                </div>


                <div class="form-actions">

                    <a th:href="@{/settings}"
                       class="cancel-button">
                        Cancel
                    </a>

                    <button type="submit"
                            class="save-button">
                        Change Password
                    </button>

                </div>

            </form>

        </section>

    </main>

</div>

</body>
</html>
