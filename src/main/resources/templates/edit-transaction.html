<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Transaction | BudgetManager</title>

    <link rel="stylesheet"
          th:href="@{/css/transaction.css}">

</head>

<body>


<div class="page-container">


    <div class="transaction-card">


        <div class="card-header">

            <a th:href="@{/transactions}"
               class="back-btn">
                ←
            </a>

            <div>

                <h1>Edit Transaction</h1>

                <p>
                    Update your transaction details
                </p>

            </div>

        </div>


        <form th:action="@{/transactions/edit/{id}
              (id=${transaction.id})}"

              th:object="${transaction}"

              method="post">


            <!-- TITLE -->

            <div class="form-group">

                <label>Title</label>

                <input type="text"
                       th:field="*{title}"
                       required>

            </div>


            <!-- AMOUNT -->

            <div class="form-group">

                <label>Amount</label>

                <div class="amount-input">

                    <span>₹</span>

                    <input type="number"
                           th:field="*{amount}"
                           min="0.01"
                           step="0.01"
                           required>

                </div>

            </div>


            <!-- TYPE -->

            <div class="form-group">

                <label>Transaction Type</label>

                <select th:field="*{type}"
                        required>

                    <option value="INCOME">
                        Income
                    </option>

                    <option value="EXPENSE">
                        Expense
                    </option>

                </select>

            </div>


            <!-- CATEGORY -->

            <div class="form-group">

                <label>Category</label>

                <select th:field="*{category}"
                        required>

                    <option value="Salary">
                        Salary
                    </option>

                    <option value="Freelance">
                        Freelance
                    </option>

                    <option value="Business">
                        Business
                    </option>

                    <option value="Investment">
                        Investment
                    </option>

                    <option value="Food">
                        Food & Dining
                    </option>

                    <option value="Shopping">
                        Shopping
                    </option>

                    <option value="Transportation">
                        Transportation
                    </option>

                    <option value="Bills">
                        Bills & Utilities
                    </option>

                    <option value="Entertainment">
                        Entertainment
                    </option>

                    <option value="Health">
                        Health
                    </option>

                    <option value="Education">
                        Education
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <!-- DATE -->

            <div class="form-group">

                <label>Transaction Date</label>

                <input type="date"
                       th:field="*{transactionDate}"
                       required>

            </div>


            <!-- DESCRIPTION -->

            <div class="form-group">

                <label>
                    Description
                    <span>(Optional)</span>
                </label>

                <textarea th:field="*{description}"
                          rows="4"
                          maxlength="500">
                </textarea>

            </div>


            <!-- BUTTONS -->

            <div class="form-actions">

                <a th:href="@{/transactions}"
                   class="cancel-btn">

                    Cancel

                </a>


                <button type="submit"
                        class="save-btn income-save">

                    Save Changes

                </button>

            </div>


        </form>

    </div>

</div>


</body>
</html>
