<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Settings | BudgetManager</title>

    <link rel="stylesheet" th:href="@{/css/settings.css}">
</head>

<body>

<div class="app-container">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">
            <div class="logo-icon">▣</div>
            <h2>Budget<span>Manager</span></h2>
        </div>

        <nav>

            <a th:href="@{/dashboard}" class="nav-link">
                <span>▦</span>
                Dashboard
            </a>

            <a th:href="@{/transactions}" class="nav-link">
                <span>⇄</span>
                Transactions
            </a>

            <a th:href="@{/budgets}" class="nav-link">
                <span>₹</span>
                Budget
            </a>

            <a th:href="@{/goals}" class="nav-link">
                <span>◉</span>
                Goals
            </a>

            <a th:href="@{/reports}" class="nav-link">
                <span>▥</span>
                Reports
            </a>

        </nav>


        <div class="sidebar-bottom">

            <a th:href="@{/settings}"
               class="nav-link active">
                <span>⚙</span>
                Settings
            </a>

            <form th:action="@{/logout}"
                  method="post"
                  class="logout-form">

                <button type="submit"
                        class="nav-link logout logout-button">

                    <span>↪</span>
                    Logout

                </button>

            </form>

        </div>

    </aside>


    <!-- MAIN CONTENT -->

    <main class="main-content">

        <div class="page-header">

            <p class="page-label">
                Account
            </p>

            <h1>Settings</h1>

            <p>
                Manage your account and preferences.
            </p>

        </div>


        <!-- PROFILE CARD -->

        <section class="settings-card">

            <div class="card-header">

                <div>
                    <h2>Profile Information</h2>

                    <p>
                        Your personal account information
                    </p>
                </div>

            </div>


            <div class="alert error-alert"
                 th:if="${profileError}"
                 th:text="${profileError}">
            </div>

            <div class="alert success-alert"
                 th:if="${profileSuccess}"
                 th:text="${profileSuccess}">
            </div>


            <div class="profile-section">

                <div class="profile-avatar">

                    <span th:text="${#strings.substring(user.name,0,1)}">
                        U
                    </span>

                </div>


                <form th:action="@{/settings/update-profile}"
                      method="post"
                      class="profile-details">


                    <div class="detail-group">

                        <label for="name">
                            Name
                        </label>

                        <input type="text"
                               id="name"
                               name="name"
                               th:value="${user.name}"
                               required>

                    </div>


                    <div class="detail-group">

                        <label>
                            Email Address
                        </label>

                        <input type="email"
                               th:value="${user.email}"
                               readonly>

                    </div>


                    <div class="profile-actions">

                        <button type="submit"
                                class="save-profile-button">
                            Save Changes
                        </button>

                    </div>

                </form>

            </div>

        </section>


        <!-- SECURITY -->

        <section class="settings-card">

            <div class="card-header">

                <div>

                    <h2>
                        Security
                    </h2>

                    <p>
                        Manage your account security
                    </p>

                </div>

            </div>


            <div class="security-row">

                <div>

                    <h3>
                        Password
                    </h3>

                    <p>
                        Change your account password.
                    </p>

                </div>


                <a th:href="@{/settings/change-password}"
                   class="secondary-button">
                    Change Password
                </a>

            </div>

        </section>

    </main>

</div>

</body>
</html>
